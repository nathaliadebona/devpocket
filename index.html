<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>DevPocket</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>DevPocket</h1>
    </header>

    <main>
        <section>
            <h2>Conversor de Unidades</h2>

            <form>
                <div class="campo">
                    <label for="valor-px">Pixels</label>
                    <input type="number" id="valor-px" min="0">
                </div>

                <div class="campo">
                    <label for="valor-base">Tamanho base da fonte (px)</label>
                    <input type="number" id="valor-base" value="16" min="1">
                </div>

                <div class="campo">
                    <label for="resultado">Resultado</label>
                    <output id="resultado">0 rem</output>
                </div>
            </form>
        </section>

        <section>
            <h2>Conversor de Cores</h2>

            <div id="cor-preview"></div>

            <form>
                <div class="campo">
                    <label for="valor-hex">HEX</label>
                    <input type="text" id="valor-hex" maxlength="7" value="#7C5CFC">
                </div>

                <div class="campo-cor">
                    <label for="seletor-cor">Seletor de cor</label>
                    <input type="color" id="seletor-cor" value="#7C5CFC">
                </div>
                
                <div class="campo-resultado">
                    <label for="resultado-rgb">Resultado RGB</label>
                    <output id="resultado-rgb">rgb(124, 92, 252)</output>
                    <button type="button" aria-label="Copiar RGB" class="botao-copiar">Copiar</button>
                </div>
                
                <div class="campo-resultado">
                    <label for="resultado-hsl">Resultado HSL</label>
                    <output id="resultado-hsl">252°, 96%, 67%</output>
                    <button type="button" aria-label="Copiar HSL" class="botao-copiar">Copiar</button>
                </div>
            </form>
        </section>

        <section>
            <h2>Gerador de CSS</h2>

            <div class="gerador-preview">
                <div id="gerador-preview-caixa"></div>
            </div>

            <form>
                <div class="controle">
                    <label for="deslocamento-horizontal">Deslocamento horizontal</label>
                    <span id="valor-deslocamento-horizontal">0</span>
                    <input type="range" id="deslocamento-horizontal" min="-50" max="50" value="0">
                </div>

                <div class="controle">
                    <label for="deslocamento-vertical">Deslocamento vertical</label>
                    <span id="valor-deslocamento-vertical">4</span>
                    <input type="range" id="deslocamento-vertical" min="-50" max="50" value="4">
                </div>

                <div class="controle">
                    <label for="desfoque">Desfoque</label>
                    <span id="valor-desfoque">20</span>
                    <input type="range" id="desfoque" min="0" max="100" value="20">
                </div>

                <div class="controle">
                    <label for="opacidade">Opacidade</label>
                    <span id="valor-opacidade">12%</span>
                    <input type="range" id="opacidade" min="0" max="100" value="12">
                </div>

                <div class="controle-cor">
                    <label for="cor-sombra">Cor da sombra</label>
                    <input type="color" id="cor-sombra" value="#7C5CFC">
                </div>

                <div class="campo-resultado">
                    <label for="resultado-sombra">Código CSS</label>
                    <output id="resultado-sombra">box-shadow: 0px 4px 20px rgba(124, 92, 252, 0.12);</output>
                    <button type="button" aria-label="Copiar CSS" class="botao-copiar">Copiar</button>
                </div>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
